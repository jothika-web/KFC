<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFC Sign In</title>
    <link rel="icon" href="./images/title.jpeg">
    <link rel="stylesheet" href="signin.css">
</head>
<body>
    <div class="container">
        <p class="top-text">Sign In / Sign up</p>
        <a class="logo" href="index.html"><img src="./images/kfc-logo.svg" alt="kfc-logo"></a>
        <h2 class="heading">LET’S SIGN IN OR CREATE ACCOUNT WITH YOUR PHONE NUMBER!</h2>
        <div class="form">
            <input type="text" placeholder="Phone Number*">
            <p class="terms">By “logging in to KFC”, you agree to our 
                <span>Privacy Policy</span> and 
                <span>Terms & Conditions</span>.
            </p>
            <button class="primary-btn">Send Me a Code</button>
            <div class="divider">
                <span></span>
                <p>or</p>
                <span></span>
            </div>
            <a href="index.html"><button class="secondary-btn">Skip, Continue As Guest</button></a>
        </div>
    </div>
</body>
</html>
